[package]
name = "ultrahonk_rust_verifier"
version = "0.1.0"
edition = "2021"

license     = "MIT"
description = "Rust verifier for UltraHonk proofs - Soroban native"
repository  = "https://github.com/yugocabrio/ultrahonk-rust-verifier"

[dependencies]
# Soroban SDK for native crypto operations
soroban-sdk = { git = "https://github.com/stellar/rs-soroban-sdk", tag = "v25.0.0-rc.1", default-features = false }

# Only ark-ff and ark-bn254 needed for Fr scalar field arithmetic
ark-ff = { version = "0.5", default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }

serde = { version = "1.0", features = ["derive"], default-features = false, optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[features]
default = []
std = [
    "ark-ff/std",
    "ark-bn254/std",
    "hex/std",
    "alloc",
]
trace = []

# Optional alloc support (not required for core functionality)
alloc = [
    "hex/alloc",
]
